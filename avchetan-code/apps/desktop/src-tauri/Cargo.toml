[package]
name = "avchetan-desktop"
version = "0.2.0"
description = "Avchetan desktop shell"
license = "AGPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "avchetan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-global-shortcut = "=2.4.1"
# unsafe-headers: the app sends no Origin, which Ollama would refuse (src/platform/native-fetch.ts).
tauri-plugin-http = { version = "=2.8.3", features = ["unsafe-headers"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
# `bundled` compiles SQLite in, so every install runs the same version.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native", "linux-native"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
# Windows notifications with a click handler (the daily brief opens Days on its day).
tauri-winrt-notification = "=0.8.1"
# The window in front when the hotkey fires (docs/product/window-context.md). Already in the tree.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
