name: Bug report
description: Something in Avchetan doesn't work as the user guide says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before you start:
        - Run the **Setup check** (Windows: **Settings → Setup check**; Android: **More → Setup check**) and look at [Troubleshooting](https://tulsiram-sunrise.github.io/avchetan/user-guide/troubleshooting). Many problems have a fix there.
        - **Never paste your entries, sync tokens, pairing codes or API keys.** Replace them with made-up text.
        - A security problem? Don't open an issue; see [SECURITY.md](https://github.com/tulsiram-sunrise/avchetan/blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the exact error text.
      placeholder: |
        1. On the phone, I tapped More → Sync → Sync now
        2. I expected the entry from my PC to appear
        3. Instead it said "..."
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Where
      multiple: true
      options:
        - Windows app
        - Home Hub (on the Windows app)
        - Android app
        - Cloud or own server
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Avchetan version
      description: "Windows: Settings → About. Android: the bottom of More."
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Just one device (Standalone)
        - Home Hub
        - Cloud server
        - Not set up yet
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows or Android version, and AI models
      placeholder: "Windows 11 24H2, Android 14; Ollama with granite4.2:8b"
  - type: textarea
    id: check
    attributes:
      label: Setup check
      description: What the Setup check shows (a screenshot is fine, if it shows no personal data).
