# Keeps the pinned actions (commit SHAs) and container images (digests) current: once a month, one
# pull request per ecosystem. npm and Cargo dependencies are updated by hand (exact versions,
# pnpm's release-age check); `pnpm audit` and `cargo audit` in CI flag the ones with advisories.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /avchetan-code/apps/server
    # Major versions (Node 26, Postgres 19, Caddy 3) are moved to by hand: they change what the
    # images contain (Node 26 has no corepack) and the docs name the versions.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    groups:
      server-image:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories:
      - /avchetan-code/apps/server
      - /avchetan-code/deploy/cloud
    # Major versions (Node 26, Postgres 19, Caddy 3) are moved to by hand: they change what the
    # images contain (Node 26 has no corepack) and the docs name the versions.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    groups:
      compose-images:
        patterns: ["*"]
