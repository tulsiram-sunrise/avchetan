# Builds the Windows installer (with the hub inside) and the signed Android APK.
# - Run by hand (Actions → Release → Run workflow), or by pushing to a `release/**` branch (to try
#   a branch before it is merged): the files as downloadable artifacts. A `release/**` push builds
#   the APK only when the branch name contains `android` (it takes most of the time); a manual run
#   has an "Android APK" checkbox, on by default.
# - On a tag `v*`: the tag must match the apps' version (`pnpm version:set`). Also the server
#   image on GitHub's container registry (ghcr.io/<owner>/avchetan-server), and a *draft* GitHub
#   release with both files, their SHA-256 sums and the install notes (.github/release-notes.md),
#   which the maintainer reads and publishes.
# The APK is signed with the release key from repository secrets (ADR-0018); without them the
# job fails rather than publish a debug-signed APK.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      android:
        description: Android APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LEFTHOOK: 0

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # A tag has to match the files; a branch build uses whatever they say.
      - name: Check the version
        working-directory: avchetan-code
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node tooling/scripts/version.ts check "$GITHUB_REF_NAME"
          else
            node tooling/scripts/version.ts check
          fi

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: avchetan-code
    env:
      # whisper-rs-sys generates its bindings with libclang (voice capture); the runner image has LLVM.
      LIBCLANG_PATH: "C:/Program Files/LLVM/bin"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: avchetan-code/package.json
          cache: true
          cache_dependency_path: avchetan-code/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: avchetan-code/apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Tauri downloads its installer tool (NSIS) on every build, and a GitHub download outage
      # failed the release on 2026-11-08. The cache helps a re-run on the same branch (caches
      # from other release branches aren't shared); the retries below ride out short outages.
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('avchetan-code/apps/desktop/package.json') }}
          restore-keys: tauri-tools-${{ runner.os }}-

      # The server as one executable, with PGlite beside it (ADR-0024).
      - run: pnpm --filter @avchetan/server build:sidecar

      - name: Build the app and installer
        shell: bash
        run: |
          # A retry only redoes what failed: Rust and the web build are already done.
          for attempt in 1 2 3; do
            pnpm --filter @avchetan/desktop build:release && exit 0
            echo "::warning::Build attempt $attempt failed; retrying in 2 minutes"
            sleep 120
          done
          exit 1

      - name: Name the installer
        shell: bash
        run: |
          mkdir -p ../out
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe \
            "../out/avchetan-${GITHUB_REF_NAME//\//-}-windows-x64-setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: avchetan-windows
          path: out/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.android) ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.ref_name, 'android')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avchetan-code
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: avchetan-code/package.json
          cache: true
          cache_dependency_path: avchetan-code/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Keeps Gradle and its dependencies for a re-run on the same branch: a gradle.org outage
      # failed the release on 2026-11-08. Release branches and tags aren't the default branch,
      # so writing the cache has to be allowed. The APK step also retries the download.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        working-directory: avchetan-code/apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_* secrets are missing (docs/conventions/releasing.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        working-directory: avchetan-code/apps/mobile
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: 1
          AVCHETAN_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          AVCHETAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AVCHETAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AVCHETAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Each build updates the previous one.
          AVCHETAN_VERSION_CODE: ${{ github.run_number }}
        run: |
          export NODE_PATH="$GITHUB_WORKSPACE/avchetan-code/node_modules/.pnpm/node_modules"
          # Fetch Gradle itself first, with retries: gradle.org can time out.
          for attempt in 1 2 3 4 5; do
            ./android/gradlew -p android --version > /dev/null && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            echo "::warning::Downloading Gradle failed (attempt $attempt); retrying in 2 minutes"
            sleep 120
          done
          ./android/gradlew -p android assembleRelease

      - name: Check the signature, and name the APK
        working-directory: avchetan-code/apps/mobile
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi
          grep "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt"
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$apk" "$GITHUB_WORKSPACE/out/avchetan-${GITHUB_REF_NAME//\//-}-android.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: avchetan-android
          path: out/*.apk
          if-no-files-found: error

  server-image:
    name: Server image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # v0.2.0 → tags 0.2.0, 0.2 and latest. The source label links the image to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/avchetan-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Avchetan server
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v7
        with:
          context: avchetan-code
          file: avchetan-code/apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  draft-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android, server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false

      # Only the two builds: the image job also leaves a Docker build record as an artifact.
      - uses: actions/download-artifact@v8
        with:
          pattern: avchetan-*
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The install notes come first; GitHub adds its list of merged changes after them.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -e "s/{{tag}}/$GITHUB_REF_NAME/g" -e "s/{{version}}/${GITHUB_REF_NAME#v}/g" \
            -e "s#{{repository}}#$GITHUB_REPOSITORY#g" \
            .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Avchetan $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
