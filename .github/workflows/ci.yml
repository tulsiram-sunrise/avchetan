# Checks for every push and pull request (docs/conventions/git.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, licenses, doc links
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avchetan-code
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: avchetan-code/package.json
          cache: true
          cache_dependency_path: avchetan-code/pnpm-lock.yaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @avchetan/mobile bundle
        env:
          EXPO_NO_TELEMETRY: 1
      - run: pnpm licenses:check
      # Known advisories in production dependencies. The few ignored ones are listed, with the
      # reason, under auditConfig in pnpm-workspace.yaml.
      - run: pnpm audit --prod
      - run: pnpm docs:check-links
      - run: pnpm errors:check
      - run: pnpm version:check

  server-postgres:
    name: Server on Postgres, server image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avchetan-code
    env:
      LEFTHOOK: 0
    services:
      # The same image as apps/server/compose.yml. Reachable only inside this job, so no password.
      postgres:
        image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: avchetan-code/package.json
          cache: true
          cache_dependency_path: avchetan-code/pnpm-lock.yaml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # The checks job runs these on PGlite; server code must work on both.
      - name: Server tests on Postgres
        run: pnpm --filter @avchetan/server test
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres

      - name: Build the server image
        run: docker build -f apps/server/Dockerfile -t avchetan-server:ci .

      - name: The image starts and answers health
        run: |
          docker run -d --name hub -e DB_DRIVER=pglite -e SERVER_PROFILE=hub -p 8787:8787 avchetan-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/v1/health; then exit 0; fi
            sleep 2
          done
          # Logger lines only: the token the server printed on its first start stays out of CI logs.
          docker logs hub 2>&1 | grep '^\[' || true
          exit 1

  cloud-compose:
    name: Own-server setup (deploy/cloud)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avchetan-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # localhost: Caddy serves HTTPS with its own local certificate instead of Let's Encrypt.
      - name: Start Postgres, the server, Caddy and the backups
        run: |
          printf 'DOMAIN=localhost\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 16)" > deploy/cloud/.env
          docker compose -f deploy/cloud/compose.yml --env-file deploy/cloud/.env up -d --build

      - name: Health through Caddy over HTTPS, and a first backup
        run: |
          compose="docker compose -f deploy/cloud/compose.yml --env-file deploy/cloud/.env"
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/v1/health; then
              $compose exec -T backup sh -c 'ls /backups/avchetan-*.sql.gz' && exit 0
            fi
            sleep 3
          done
          $compose ps
          $compose logs caddy postgres backup
          # Logger lines only: the token the server printed on its first start stays out of CI logs.
          $compose logs --no-log-prefix server 2>&1 | grep '^\[' || true
          exit 1

      - name: Stop
        if: always()
        run: docker compose -f deploy/cloud/compose.yml --env-file deploy/cloud/.env down -v

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-audit:
    name: Desktop shell's crates (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit
      # Fails on a known vulnerability (RustSec) in Cargo.lock. Warnings (unmaintained, unsound or
      # yanked crates, all deep in Tauri's tree in 2026-11) are printed, not failed: they have no
      # fix to take. To accept a vulnerability, list it with the reason in .cargo/audit.toml there.
      - run: cargo audit
        working-directory: avchetan-code/apps/desktop/src-tauri

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit in the pull request is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  desktop-rust:
    name: Desktop shell (rustfmt, clippy)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: avchetan-code/apps/desktop/src-tauri
    env:
      LEFTHOOK: 0
      # whisper-rs-sys generates its bindings with libclang (voice capture); the runner image has LLVM.
      LIBCLANG_PATH: "C:/Program Files/LLVM/bin"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      # Keyed by the runner image: whisper-rs-sys keeps a CMake cache with the compiler's full path,
      # which a new image (a newer Visual Studio) no longer has (failed 2026-11-19).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: avchetan-code/apps/desktop/src-tauri
          key: ${{ env.ImageVersion }}

      # tauri::generate_context! expects frontendDist to exist; the web assets aren't needed for linting.
      - run: New-Item -ItemType Directory -Force ../dist
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
