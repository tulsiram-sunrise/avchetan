# Checks for every push and pull request (docs/conventions/git.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, licenses, doc links
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avchetan-code
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: avchetan-code/package.json
          cache: true
          cache_dependency_path: avchetan-code/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @avchetan/mobile bundle
        env:
          EXPO_NO_TELEMETRY: 1
      - run: pnpm licenses:check
      - run: pnpm docs:check-links

  server-postgres:
    name: Server on Postgres, server image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avchetan-code
    env:
      LEFTHOOK: 0
    services:
      # The same image as apps/server/compose.yml. Reachable only inside this job, so no password.
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: avchetan-code/package.json
          cache: true
          cache_dependency_path: avchetan-code/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # The checks job runs these on PGlite; server code must work on both.
      - name: Server tests on Postgres
        run: pnpm --filter @avchetan/server test
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres

      - name: Build the server image
        run: docker build -f apps/server/Dockerfile -t avchetan-server:ci .

      - name: The image starts and answers health
        run: |
          docker run -d --name hub -e DB_DRIVER=pglite -e SERVER_PROFILE=hub -p 8787:8787 avchetan-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/v1/health; then exit 0; fi
            sleep 2
          done
          # Logger lines only: the token the server printed on its first start stays out of CI logs.
          docker logs hub 2>&1 | grep '^\[' || true
          exit 1

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit in the pull request is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  desktop-rust:
    name: Desktop shell (rustfmt, clippy)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: avchetan-code/apps/desktop/src-tauri
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: avchetan-code/apps/desktop/src-tauri

      # tauri::generate_context! expects frontendDist to exist; the web assets aren't needed for linting.
      - run: New-Item -ItemType Directory -Force ../dist
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
