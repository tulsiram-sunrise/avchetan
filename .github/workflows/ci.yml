# Checks for every push and pull request (docs/conventions/git.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, licenses, doc links
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avchetan-code
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: avchetan-code/package.json
          cache: true
          cache_dependency_path: avchetan-code/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @avchetan/mobile bundle
        env:
          EXPO_NO_TELEMETRY: 1
      - run: pnpm licenses:check
      - run: pnpm docs:check-links

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit in the pull request is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  desktop-rust:
    name: Desktop shell (rustfmt, clippy)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: avchetan-code/apps/desktop/src-tauri
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: avchetan-code/apps/desktop/src-tauri

      # tauri::generate_context! expects frontendDist to exist; the web assets aren't needed for linting.
      - run: New-Item -ItemType Directory -Force ../dist
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
